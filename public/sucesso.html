<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Download concluído</title>
</head>

<body>

<script>

const MAX_DOWNLOADS = 3;

async function baixarPDF(session_id, id, cupom){

    const parametros = new URLSearchParams({ id });
    if(session_id) parametros.set("session_id", session_id);
    const headers = cupom ? { Authorization: "Bearer " + cupom } : {};
    const resp = await fetch(`/api/gerar-pdfs?${parametros}`, { headers });

    if(!resp.ok){
        alert("Erro ao gerar download.");
        return false;
    }

    // 🔥 PEGA O NOME DO BACKEND
    const contentDisposition = resp.headers.get("Content-Disposition");

    let nomeArquivo = "orcamento.zip"; // fallback

    if(contentDisposition){
        const match = contentDisposition.match(/filename="(.+)"/);
        if(match && match[1]){
            nomeArquivo = match[1];
        }
    }

    const blob = await resp.blob();
    const url = window.URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;

    // 🔥 AGORA SIM: USA O NOME CORRETO
    a.download = nomeArquivo;

    document.body.appendChild(a);
    a.click();
    a.remove();

    window.URL.revokeObjectURL(url);
    return true;
}

async function iniciar(){

    const params = new URLSearchParams(window.location.search);

    const session_id = params.get("session_id");
    const id = params.get("id");
    const cupom = new URLSearchParams(location.hash.slice(1)).get("cupom");

    if((!session_id && !cupom) || !id){

        document.body.innerHTML =
        "<h2>Erro: parâmetros de pagamento não encontrados.</h2>";

        return;
    }

    const chave = "downloads_" + (session_id || id);

    document.body.innerHTML = `
    <div style="font-family:Arial;text-align:center;margin-top:60px">

        <h2 id="status-download">Preparando seu download…</h2>

        <p>Verifique a pasta de downloads do seu navegador.</p>

        <br>

        <button id="baixar">Baixar novamente</button>

        <br><br>

        <button id="voltar">Voltar para o Orçamento Fácil</button>

        <br><br>

    </div>
    `;

    const botaoBaixar = document.getElementById("baixar");
    const statusDownload = document.getElementById("status-download");
    botaoBaixar.onclick = async function(){
        const downloads = Number(sessionStorage.getItem(chave)) || 0;

        if(downloads >= MAX_DOWNLOADS){
            alert("Limite de downloads atingido.");
            return;
        }

        botaoBaixar.disabled = true;
        try {
            if(await baixarPDF(session_id, id, cupom)){
                sessionStorage.setItem(chave, downloads + 1);
                statusDownload.textContent = "Download concluído com sucesso.";
            }else statusDownload.textContent = "Download indisponível. Tente novamente.";
        } catch {
            statusDownload.textContent = "Download indisponível. Tente novamente.";
        } finally {
            botaoBaixar.disabled = false;
        }
    };

    // 🔙 VOLTAR
    document.getElementById("voltar").onclick = function(){
        window.location.href = "/";
    };

    if((Number(sessionStorage.getItem(chave)) || 0) < MAX_DOWNLOADS) await botaoBaixar.onclick();
    else statusDownload.textContent = "Limite de downloads atingido.";
}

window.onload = iniciar;

</script>

</body>
</html>
